[project]
name = "setisignals"
version = "0.1.5"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Wei Liu", email = "liuwei_berkeley@berkeley.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "astropy>=8.0.1",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "ray[default]>=2.58.0",
    "rich>=15.0.0",
    "typer>=0.27.1",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]

[project.scripts]
setisignals = "setisignals.cli:app"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
